# テスト用設定（@ActiveProfiles("test")）。MySQL の代わりにインメモリの H2 を使う。
spring:
  datasource:
    url: jdbc:h2:mem:music_tracker_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

app:
  init:
    demo-user: false
  audio:
    storage: local
    upload-dir: target/test-uploaded-audio
