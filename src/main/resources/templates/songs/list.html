<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead('Music-Tracker')}"></th:block>
    <style>
        /* インライン編集できるセルであることを示す */
        td.editable { cursor: pointer; }
        td.editable:hover { background-color: #f1f5ff; }
        td.editable.editing { background-color: #fff; cursor: default; }
        .cell-empty { color: #b8bec6; font-style: italic; }
        .inline-toast {
            position: fixed;
            bottom: 1.2rem; right: 1.2rem;
            z-index: 2000;
            min-width: 200px;
            display: none;
        }
        /* 行のドラッグ&ドロップ */
        .drag-cell { width: 34px; text-align: center; }
        .row-handle {
            cursor: grab;
            color: #adb5bd;
            user-select: none;
            font-size: 1.1rem;
        }
        .row-handle:active { cursor: grabbing; }
        tr.dragging { opacity: .45; background-color: #eef4ff; }

        /* 納期 */
        .done-cell { width: 4.5rem; text-align: center; white-space: nowrap; }
        .done-check { width: 1.2rem; height: 1.2rem; cursor: pointer; }
        .overdue-badge { font-size: .72rem; }
        .deadline-editor { display: flex; gap: .3rem; align-items: center; }
        .deadline-editor input { width: 10.5rem; }

        /* ステータス・タグの選択ポップアップ（ワンクリックで開く） */
        .pick-menu {
            position: absolute; z-index: 2100;
            min-width: 11rem; max-height: 60vh; overflow: auto;
            background: #fff; border: 1px solid #d7dde4; border-radius: .5rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
            padding: .3rem;
        }
        .pick-menu button {
            display: flex; align-items: center; gap: .4rem; width: 100%;
            border: 0; background: transparent; text-align: left;
            border-radius: .35rem; padding: .35rem .5rem;
        }
        .pick-menu button:hover, .pick-menu button:focus { background: #eef4ff; outline: none; }
        .pick-menu button.current { font-weight: 700; }
        .pick-menu button.current::after { content: "✓"; margin-left: auto; color: #0d6efd; }

        /* タグ管理 */
        .tag-manager {
            background: #fff; border: 1px solid #e3e6ea; border-radius: .6rem;
            padding: .75rem; margin-top: .5rem;
        }
        .tag-chip {
            display: inline-flex; align-items: center; gap: .3rem;
            background: #f1f3f5; border: 1px solid #dee2e6; border-radius: 999px;
            padding: .15rem .3rem .15rem .7rem; font-size: .85rem;
        }
        .tag-chip button {
            border: 0; background: transparent; color: #8a929b;
            line-height: 1; font-size: 1rem; padding: 0 .25rem; border-radius: 50%;
        }
        .tag-chip button:hover { color: #dc3545; background: #fde8e8; }

        /* ---- セクション（楽曲一覧 / バックアップ一覧） ---- */
        .section-title {
            font-size: 1.15rem; font-weight: 700; color: #343a40;
            display: flex; align-items: center;
            padding-bottom: .4rem; margin-bottom: .8rem;
            border-bottom: 2px solid #dee2e6;
        }
        .song-section[data-archive="true"] .section-title { color: #6c757d; }
        /* 楽曲一覧とバックアップ一覧で列の位置をそろえる */
        .song-section table { table-layout: fixed; min-width: 860px; }
        .song-section th:nth-child(1) { width: 34px; }
        .song-section th:nth-child(2) { width: 22%; }
        .song-section th:nth-child(3) { width: 13%; }
        .song-section th:nth-child(4) { width: 17%; }
        .song-section th:nth-child(5) { width: 17%; }
        .song-section th:nth-child(6) { width: 4.5rem; }
        .song-section th:nth-child(7) { width: 15.5rem; }
        .song-section td { overflow-wrap: anywhere; }
        .archive-table td { color: #6c757d; }

        /* ---- ヒント（編集できる場所にカーソルを合わせると、半透明の吹き出しで表示） ---- */
        .has-hint { position: relative; }
        .has-hint::after {
            content: attr(data-hint);
            position: absolute; left: 50%; bottom: calc(100% + 2px);
            transform: translate(-50%, 4px);
            z-index: 1500;
            background: rgba(33, 37, 41, .78);
            color: #fff; font-size: .74rem; font-weight: 400; font-style: normal;
            white-space: nowrap; pointer-events: none;
            padding: .3rem .6rem; border-radius: .4rem;
            opacity: 0; visibility: hidden;
            transition: opacity .15s ease .35s, transform .15s ease .35s, visibility 0s linear .5s;
            backdrop-filter: blur(2px);
        }
        .has-hint:hover::after {
            opacity: 1; visibility: visible; transform: translate(-50%, 0);
            transition: opacity .15s ease .35s, transform .15s ease .35s, visibility 0s linear .35s;
        }
        /* 編集中・ポップアップ表示中はヒントを出さない */
        .has-hint.editing::after { display: none; }

        /* ---- モバイルカード ---- */
        .song-card {
            background: #fff;
            border-radius: .6rem;
            box-shadow: 0 1px 4px rgba(0,0,0,.07);
            padding: 1rem;
            margin-bottom: .75rem;
            border-left: 4px solid transparent;
        }
        .song-card.overdue { border-left-color: #dc3545; background: #fff5f5; }

        /* ---- タグ絞り込み横スクロール ---- */
        .tag-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: .25rem; }
        .tag-scroll .d-flex { flex-wrap: nowrap; }

        /* ---- FAB（新規登録） ---- */
        .fab {
            position: fixed;
            bottom: 1.5rem; right: 1.5rem;
            z-index: 1000;
            width: 56px; height: 56px;
            border-radius: 50%;
            font-size: 1.5rem; line-height: 1;
            padding: 0;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(13,110,253,.4);
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="h3 mb-0">🎵 Music-Tracker</h1>
        <div class="d-flex gap-2 flex-wrap">
            <a th:if="${lastOpenedSong != null}"
               th:href="@{/songs/{id}(id=${lastOpenedSong.id})}"
               class="btn btn-outline-success d-none d-md-inline-flex"
               th:title="'「' + ${lastOpenedSong.title} + '」を開く'">
                🎵 最後に編集した曲に戻る
            </a>
            <a th:href="@{/calendar}" class="btn btn-outline-primary">📅 カレンダー</a>
            <a th:href="@{/songs/new}" class="btn btn-primary d-none d-md-inline-flex">＋ 新規登録</a>
            <span class="vr mx-1 d-none d-md-inline"></span>
            <a th:href="@{/profile}" class="btn btn-outline-secondary align-self-center"
               title="プロフィール設定">👤 <span th:text="${currentUsername}">user</span></a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-secondary">ログアウト</button>
            </form>
        </div>
    </div>

    <!-- 保存・削除後のメッセージ -->
    <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>

    <!-- タグ絞り込みとタグ管理 -->
    <div class="mb-4">
        <div class="d-flex align-items-center gap-2 mb-1">
            <span class="fw-bold small">タグで絞り込み:</span>
            <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" id="tag-manage-toggle"
                    aria-expanded="false" aria-controls="tag-manager">🏷 タグを編集</button>
        </div>
        <div class="tag-scroll">
            <div class="d-flex gap-1">
                <a th:href="@{/songs}"
                   class="btn btn-sm flex-shrink-0"
                   th:classappend="${selectedTagId == null} ? 'btn-dark' : 'btn-outline-dark'">
                    すべて
                </a>
                <a th:each="tag : ${tags}"
                   th:href="@{/songs(tagId=${tag.id})}"
                   class="btn btn-sm flex-shrink-0"
                   th:classappend="${selectedTagId != null and selectedTagId == tag.id} ? 'btn-secondary' : 'btn-outline-secondary'"
                   th:text="${tag.name}">タグ</a>
            </div>
        </div>

        <!-- タグの追加・削除（自分のタグだけ。削除すると付いている曲からも外れる） -->
        <div class="tag-manager" id="tag-manager" hidden>
            <div class="d-flex flex-wrap gap-2 mb-2">
                <span th:each="tag : ${tags}" class="tag-chip">
                    <span th:text="${tag.name}">タグ</span>
                    <button type="button" class="tag-delete" th:attr="data-id=${tag.id},data-name=${tag.name}"
                            th:title="'「' + ${tag.name} + '」を削除'">×</button>
                </span>
                <span th:if="${tags.isEmpty()}" class="text-muted small">タグはまだありません。</span>
            </div>
            <form class="d-flex gap-2" id="tag-add-form" autocomplete="off">
                <input type="text" class="form-control form-control-sm" id="tag-add-name" maxlength="50"
                       placeholder="新しいタグ名（例: アニソン）" style="max-width: 18rem;" required>
                <button type="submit" class="btn btn-sm btn-primary text-nowrap">＋ 追加</button>
            </form>
        </div>
    </div>

    <!-- 楽曲一覧（作業中の曲）と、完了した曲のバックアップ一覧 -->
    <section th:each="sec : ${sections}" class="song-section mb-5" th:attr="data-archive=${sec.archive}">
        <h2 class="section-title">
            <span th:text="${sec.archive} ? '🗂 ' + ${sec.title} : '🎵 ' + ${sec.title}">楽曲一覧</span>
            <span class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis ms-1"
                  th:text="${sec.songs.size()} + '曲'">0曲</span>
        </h2>

        <div th:if="${sec.songs.isEmpty()}" class="alert alert-light border text-muted" th:text="${sec.emptyMessage}">
            まだ曲がありません。
        </div>

        <!-- デスクトップ: テーブル表示 -->
        <div class="table-responsive d-none d-md-block" th:unless="${sec.songs.isEmpty()}">
            <table class="table table-hover align-middle bg-white shadow-sm rounded"
                   th:classappend="${sec.archive} ? 'archive-table' : ''">
                <thead class="table-light">
                <tr>
                    <th scope="col" class="drag-cell"></th>
                    <th scope="col">曲名</th>
                    <th scope="col">ステータス</th>
                    <th scope="col">タグ</th>
                    <th scope="col">納期</th>
                    <th scope="col" class="done-cell">完了</th>
                    <th scope="col" class="text-end">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="song : ${sec.songs}" th:with="dl=${deadlines[song.id]}"
                    th:attr="data-song-id=${song.id}"
                    th:classappend="${dl != null and dl.overdue} ? 'table-danger' : ''">

                    <!-- ドラッグハンドル -->
                    <td class="drag-cell has-hint" data-hint="ドラッグで並び替え">
                        <span class="row-handle">⠿</span>
                    </td>

                    <!-- 曲名（インライン編集） -->
                    <td class="fw-bold editable has-hint" data-field="title" data-hint="クリックして曲名を編集"
                        th:attr="data-value=${song.title}">
                        <span class="cell-value" th:text="${song.title}">曲名</span>
                    </td>

                    <!-- ステータス（クリックで選択ポップアップ） -->
                    <td class="editable has-hint" data-field="status" data-hint="クリックしてステータスを選択"
                        th:attr="data-value=${song.status.name()}">
                        <span class="cell-value badge"
                              th:classappend="${song.status.colorClass}"
                              th:text="${song.status.label}">ステータス</span>
                    </td>

                    <!-- タグ（クリックで選択ポップアップ：単一選択） -->
                    <td class="editable has-hint" data-field="tagId" data-hint="クリックしてタグを選択"
                        th:attr="data-value=${song.tags.isEmpty()} ? '' : ${song.tags.iterator().next().id}">
                        <span class="cell-value">
                            <th:block th:if="${song.tags.isEmpty()}">
                                <span class="cell-empty">（なし）</span>
                            </th:block>
                            <span th:each="tag : ${song.tags}"
                                  class="badge bg-light text-dark border me-1"
                                  th:text="${tag.name}">タグ</span>
                        </span>
                    </td>

                    <!-- 納期（クリックでカレンダーから選択） -->
                    <td class="editable text-nowrap has-hint" data-field="deadline"
                        data-hint="クリックしてカレンダーから納期を選択"
                        th:attr="data-value=${dl != null} ? ${dl.date} : ''">
                        <span class="cell-value small">
                            <th:block th:if="${#strings.isEmpty(song.deadline)}"><span class="cell-empty">（未設定）</span></th:block>
                            <th:block th:unless="${#strings.isEmpty(song.deadline)}">
                                <span th:text="${dl != null} ? ${#temporals.format(dl.date, 'yyyy/MM/dd')} : ${song.deadline}">2026/06/10</span>
                                <span th:if="${dl != null and dl.overdue}" class="badge bg-danger overdue-badge ms-1"
                                      th:text="${-dl.daysUntil} + '日超過'">超過</span>
                            </th:block>
                        </span>
                    </td>

                    <!-- 完了チェック（ステータス「完了」と連動。完了した曲はバックアップ一覧へ） -->
                    <td class="done-cell has-hint"
                        th:attr="data-hint=${sec.archive} ? 'チェックを外すと楽曲一覧に戻ります' : 'チェックすると「完了」にしてバックアップ一覧へ移動'">
                        <input type="checkbox" class="form-check-input done-check" th:checked="${song.deadlineDone}"
                               aria-label="完了">
                    </td>

                    <!-- 操作（スタジオを開く・削除） -->
                    <td class="text-end text-nowrap">
                        <a th:href="@{/songs/{id}(id=${song.id})}"
                           class="btn btn-primary fw-bold px-3">🎚️ スタジオを開く</a>
                        <form th:action="@{/songs/{id}/delete(id=${song.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('本当に削除しますか？');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">削除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- モバイル: カード型一覧 -->
        <div class="d-md-none" th:unless="${sec.songs.isEmpty()}">
            <div th:each="song : ${sec.songs}" th:with="dl=${deadlines[song.id]}" class="song-card"
                 th:attr="data-song-id=${song.id}"
                 th:classappend="${dl != null and dl.overdue} ? 'overdue' : ''">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                    <div class="fw-bold" style="font-size: 1.05rem;" th:text="${song.title}">曲名</div>
                    <span class="badge flex-shrink-0"
                          th:classappend="${song.status.colorClass}"
                          th:text="${song.status.label}">ステータス</span>
                </div>
                <div th:unless="${song.tags.isEmpty()}" class="d-flex flex-wrap gap-1 mb-2">
                    <span th:each="tag : ${song.tags}"
                          class="badge bg-light text-dark border"
                          th:text="${tag.name}">タグ</span>
                </div>
                <div class="small text-muted mb-2 d-flex align-items-center gap-2 flex-wrap">
                    <span th:unless="${#strings.isEmpty(song.deadline)}">📅 <span th:text="${dl != null} ? ${#temporals.format(dl.date, 'yyyy/MM/dd')} : ${song.deadline}">納期</span></span>
                    <span th:if="${dl != null and dl.overdue}" class="badge bg-danger overdue-badge"
                          th:text="${-dl.daysUntil} + '日超過'">超過</span>
                    <label class="d-inline-flex align-items-center gap-1 ms-auto">
                        <input type="checkbox" class="form-check-input done-check m-0" th:checked="${song.deadlineDone}">
                        完了
                    </label>
                </div>
                <a th:href="@{/songs/{id}(id=${song.id})}" class="btn btn-primary w-100 py-2">🎚️ スタジオを開く</a>
            </div>
        </div>
    </section>

    <!-- スマホ用 FAB（新規登録） -->
    <a th:href="@{/songs/new}" class="btn btn-primary fab d-md-none" title="新規登録">＋</a>

</div>

<!-- ポップアップの選択肢（JS が読み取って使う） -->
<template id="tpl-status">
    <button type="button" th:each="s : ${statuses}" th:attr="data-value=${s.name()}">
        <span class="badge" th:classappend="${s.colorClass}" th:text="${s.label}">ステータス</span>
    </button>
</template>
<template id="tpl-tag">
    <button type="button" data-value=""><span class="cell-empty">（なし）</span></button>
    <button type="button" th:each="t : ${tags}" th:attr="data-value=${t.id}">
        <span class="badge bg-light text-dark border" th:text="${t.name}">タグ</span>
    </button>
</template>

<!-- 保存トースト -->
<div class="alert alert-success inline-toast shadow" id="inline-toast" role="alert">保存しました</div>

<script th:src="@{/js/list.js}"></script>
</body>
</html>
