<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead(${song.title} + ' - Music-Tracker')}"></th:block>
    <!-- コード譜エディタ（表計算）: Jspreadsheet CE と、テンプレートと同じフォント -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites@5.12.0/dist/jsuites.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@5.0.4/dist/jspreadsheet.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons&display=block">
    <link rel="stylesheet" th:href="@{/css/detail.css}">
</head>
<body th:attr="data-save-url=@{/songs/{id}/save(id=${song.id})},data-chord-url=@{/songs/{id}/chord-chart(id=${song.id})}">

<!-- ===== スクロール追従ヘッダー =====
     1段目: 楽曲一覧へ戻る・曲名 / 2段目: 進捗率とデモ音源 / 3段目: 作業の切り替えタブと保存 -->
<header class="core-header">
    <div class="top-bar">
        <div class="d-flex align-items-center gap-3 min-w-0">
            <a th:href="@{/songs}" class="btn btn-outline-primary back-btn flex-shrink-0">← 楽曲一覧</a>
            <h1 class="h5 mb-0 song-title">
                🎼 <span class="title-text" th:text="${song.title}">曲名</span>
                <span class="badge align-middle"
                      th:classappend="${song.statusColorClass}"
                      th:text="${song.statusLabel}">ステータス</span>
            </h1>
        </div>
        <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <a th:href="@{/profile}" class="btn btn-sm btn-outline-secondary"
               title="プロフィール設定">👤<span class="d-none d-lg-inline" th:text="' ' + ${currentUsername}"> user</span></a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-secondary">ログアウト</button>
            </form>
        </div>
    </div>

    <div class="studio-bar">
        <!-- 左: 進捗率（作詞・編曲・全体の横長ブロック） -->
        <section class="progress-block" aria-label="進捗率">
            <div class="metric" data-metric="lyric">
                <div class="metric-head">
                    <span>作詞</span>
                    <span><input type="number" class="pct-input" id="lyricProgress" min="0" max="100"
                                 th:value="${song.lyricProgress}" title="数値を直接入力できます">%</span>
                </div>
                <input type="range" class="pct-range" data-for="lyricProgress" min="0" max="100" step="5"
                       th:value="${song.lyricProgress}" aria-label="作詞の進捗率">
            </div>
            <div class="metric" data-metric="arrangement">
                <div class="metric-head">
                    <span>編曲</span>
                    <span><input type="number" class="pct-input" id="arrangementProgress" min="0" max="100"
                                 th:value="${song.arrangementProgress}" title="数値を直接入力できます">%</span>
                </div>
                <input type="range" class="pct-range" data-for="arrangementProgress" min="0" max="100" step="5"
                       th:value="${song.arrangementProgress}" aria-label="編曲の進捗率">
            </div>
            <div class="metric metric-overall">
                <div class="metric-head">
                    <span>全体</span>
                    <span><span id="overallVal" th:text="${song.overallProgress}">0</span>%</span>
                </div>
                <div class="progress overall-progress">
                    <div class="progress-bar" id="overallBar"
                         th:style="'width:' + ${song.overallProgress} + '%'"></div>
                </div>
            </div>
        </section>

        <!-- 進捗率の横: デモ音源 -->
        <section class="audio-block" aria-label="デモ音源">
            <span class="block-label">🎧 デモ音源</span>
            <audio th:if="${song.audioFilePath != null}" controls preload="metadata"
                   th:src="@{/songs/{id}/audio(id=${song.id}, v=${song.audioFilePath})}">
                お使いのブラウザは audio タグに対応していません。
            </audio>
            <span th:if="${song.audioFilePath == null}" class="audio-empty">未アップロード</span>
            <!-- ファイルを選ぶとすぐアップロードする（MP3 / WAV など最大 50MB） -->
            <form th:action="@{/songs/{id}/audio(id=${song.id})}" method="post" enctype="multipart/form-data"
                  class="m-0" id="audio-form">
                <input type="file" name="audioFile" id="audio-file" hidden
                       accept="audio/*,.mp3,.wav,.m4a,.ogg,.aac,.flac">
                <button type="button" class="btn btn-sm btn-outline-primary text-nowrap" id="audio-pick"
                        title="MP3 / WAV / M4A / OGG / AAC / FLAC（最大 50MB）"
                        th:text="${song.audioFilePath == null} ? '⬆ アップロード' : '⬆ 差し替え'">⬆ アップロード</button>
            </form>
        </section>
    </div>

    <!-- 作業の切り替え・Key / BPM と保存 -->
    <div class="studio-tabs">
        <div class="tabs-left">
            <nav class="d-flex" role="tablist" aria-label="作業の切り替え">
                <button type="button" class="studio-tab active" role="tab" data-tab="chord" aria-selected="true">🎼 コード譜</button>
                <button type="button" class="studio-tab" role="tab" data-tab="lyric" aria-selected="false">📝 歌詞</button>
            </nav>
            <!-- 歌詞タブの右: Key（五度圏から選ぶ）と BPM（数値入力）。「変更を保存」で保存する -->
            <div class="music-meta">
                <div class="key-wrap">
                    <span class="meta-label" id="key-label">Key</span>
                    <button type="button" class="meta-field key-btn" id="key-btn" aria-haspopup="dialog"
                            aria-expanded="false" aria-labelledby="key-label key-value"
                            title="クリックして五度圏から Key を選ぶ">
                        <span id="key-value" th:text="${song.musicKey != null and !#strings.isEmpty(song.musicKey)} ? ${song.musicKey} : 'C'">C</span>
                        <span class="caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="key-popover" id="key-popover" role="dialog" aria-label="五度圏から Key を選ぶ" hidden>
                        <div class="key-popover-head">
                            <span>五度圏から選ぶ</span>
                            <span class="small text-muted">外側: メジャー / 内側: マイナー</span>
                        </div>
                        <svg id="circle-of-fifths" viewBox="0 0 300 300" width="300" height="300"></svg>
                    </div>
                </div>
                <label class="bpm-wrap" for="bpm-input">
                    <span class="meta-label">BPM</span>
                    <input type="number" class="meta-field bpm-input" id="bpm-input" min="1" max="999" step="1"
                           inputmode="numeric" th:value="${song.bpm != null} ? ${song.bpm} : 120"
                           title="キーボードで数値を入力（1〜999）">
                </label>
            </div>
        </div>
        <div class="save-area">
            <span id="save-status" class="text-muted small"></span>
            <button type="button" id="save-all" class="btn btn-primary save-btn">💾 変更を保存</button>
        </div>
    </div>
</header>

<!-- アップロード等のメッセージ -->
<div th:if="${message}" class="alert alert-success py-2 mb-0 mx-3 mt-2" role="alert" th:text="${message}"></div>
<div th:if="${error}" class="alert alert-danger py-2 mb-0 mx-3 mt-2" role="alert" th:text="${error}"></div>

<main id="studio">

    <!-- 歌詞 -->
    <section class="panel" data-panel="lyric" role="tabpanel" hidden>
        <div class="area-header">
            <h2 class="h6 mb-0">📝 歌詞</h2>
            <!-- 表示中の歌詞（未保存の編集も含む）をファイルに書き出す -->
            <div class="chart-menu-wrap">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-menu="lyrics-export-menu"
                        title="歌詞をファイルに書き出す">📤 エクスポート ▾</button>
                <div class="chart-menu chart-menu-end" id="lyrics-export-menu">
                    <button type="button" class="lyrics-export-btn" data-format="docx">Word（.docx）</button>
                    <button type="button" class="lyrics-export-btn" data-format="txt">テキスト（.txt）</button>
                    <button type="button" class="lyrics-export-btn" data-format="pdf">PDF</button>
                </div>
            </div>
        </div>
        <div class="section-list" data-area="lyric">
            <div class="section-card" th:each="sec : ${song.lyricSections}" th:attr="data-id=${sec.id}">
                <div class="section-head">
                    <span class="drag-handle" title="ドラッグで並び替え">⠿</span>
                    <input class="section-name" type="text" th:value="${sec.name}" placeholder="セクション名">
                    <button type="button" class="btn-del" title="削除">×</button>
                </div>
                <textarea class="section-body form-control" rows="5"
                          placeholder="歌詞を入力..." th:text="${sec.content}"></textarea>
            </div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-primary w-100 add-section" data-area="lyric">
            ＋ セクション追加
        </button>
    </section>

    <!-- コード譜（Excel テンプレートを表計算エディタで直接編集） -->
    <section class="panel" data-panel="chord" role="tabpanel">
        <div class="area-header">
            <h2 class="h6 mb-0">🎼 コード譜</h2>
            <div class="d-flex align-items-center gap-1 flex-wrap">
                <div class="chart-menu-wrap">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-menu="chart-new-menu"
                            title="白紙テンプレートから作成">＋ 新規作成 ▾</button>
                    <div class="chart-menu" id="chart-new-menu">
                        <button type="button" th:each="t : ${chordTemplates}"
                                class="chart-new-btn" th:attr="data-template=${t.name()}"
                                th:text="${t.label}">テンプレート</button>
                    </div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="chart-import-btn"
                        title="Excel（.xlsx / .xls）または PDF を読み込む">📥 インポート</button>
                <input type="file" id="chart-import-file" accept=".xlsx,.xls,.pdf" hidden>
                <div class="chart-menu-wrap">
                    <button type="button" class="btn btn-sm btn-outline-secondary chart-needs-sheet"
                            data-menu="chart-export-menu" title="ファイルに書き出す">📤 エクスポート ▾</button>
                    <div class="chart-menu chart-menu-end" id="chart-export-menu">
                        <button type="button" class="chart-export-btn" data-format="xlsx">Excel（.xlsx）</button>
                        <button type="button" class="chart-export-btn" data-format="pdf">PDF</button>
                    </div>
                </div>
                <button type="button" class="btn btn-sm btn-outline-danger chart-needs-sheet" id="chart-clear-btn"
                        title="このコード譜を削除（保存時に反映）">🗑</button>
            </div>
        </div>

        <!-- コード譜がまだない曲 -->
        <div id="chart-empty" class="chart-empty" hidden>
            <p class="mb-2">まだコード譜がありません。</p>
            <div class="d-flex flex-wrap gap-2 justify-content-center mb-2">
                <button type="button" th:each="t : ${chordTemplates}"
                        class="btn btn-sm btn-primary chart-new-btn" th:attr="data-template=${t.name()}"
                        th:text="${t.label} + 'で作成'">テンプレートで作成</button>
            </div>
            <p class="small text-muted mb-0">
                手元の Excel / PDF を「📥 インポート」で読み込むこともできます。<br>
                PDF は文字データを持つものだけ読み取れます（スキャン・手書きの PDF は不可）。
            </p>
        </div>
        <div id="chart-loading" class="text-muted small p-3">読み込み中...</div>
        <!-- 表計算エディタ（Jspreadsheet） -->
        <div id="chord-sheet" class="chord-sheet"></div>
    </section>
</main>

<!-- 新規セクション用テンプレート -->
<template id="section-template">
    <div class="section-card" data-id="">
        <div class="section-head">
            <span class="drag-handle" title="ドラッグで並び替え">⠿</span>
            <input class="section-name" type="text" placeholder="セクション名">
            <button type="button" class="btn-del" title="削除">×</button>
        </div>
        <textarea class="section-body form-control" rows="5" placeholder="入力..."></textarea>
    </div>
</template>

<!-- 保存トースト -->
<div class="alert alert-success save-toast shadow" id="save-toast" role="alert">保存しました</div>

<!-- モバイル: 固定保存バー -->
<div class="mobile-save-bar">
    <button type="button" id="save-all-mobile" class="btn btn-primary w-100 py-3">💾 変更を保存</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsuites@5.12.0/dist/jsuites.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@5.0.4/dist/index.min.js"></script>
<script th:src="@{/js/detail.js}"></script>
</body>
</html>
